name: Question
description: Ask a specific question about this repository or JayPVentures community processes
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended conversation, please use [GitHub Discussions](https://github.com/JayPVentures-LLC/jpv-discussions/discussions) instead. Use this template only for specific, structured questions about this repository.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
      placeholder: Ask your question here...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any background information that helps clarify the question.
      placeholder: Optional additional context...
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and discussions and this has not already been answered.
          required: true
