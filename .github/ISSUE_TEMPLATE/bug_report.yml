name: Bug Report
description: Report a documentation error, broken link, or problem with this repository
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue. Please fill out the form below to help us address it quickly.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the problem.
      placeholder: Describe what is wrong...
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location
      description: Where did you encounter this issue? (e.g., link to a file, section, or specific URL)
      placeholder: "File: README.md, Section: How to Participate"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should the content or behavior look like?
      placeholder: Describe the expected outcome...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any screenshots, links, or other context that would help.
      placeholder: Optional additional information...
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have read the [Contributing Guidelines](../../CONTRIBUTING.md).
          required: true
