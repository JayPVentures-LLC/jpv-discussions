name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to avoid redundant work
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout@v6.0.2 — pinned SHA for supply-chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # actions/setup-node@v6.4.0 — pinned SHA for supply-chain security
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.42.0

      - name: Run markdownlint
        run: markdownlint '**/*.md'

  check-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout@v6.0.2 — pinned SHA for supply-chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check links
        # lycheeverse/lychee-action@v2.8.0 — pinned SHA for supply-chain security
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: >
            --config lychee.toml
            --exclude-loopback
            --no-progress
            '**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
